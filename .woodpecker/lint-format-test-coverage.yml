steps:

  - name: lint
    image: codeberg.org/nbcli/dev-tools:latest
    pull: true
    commands:
      - flake8 . --count
    when:
      status: [ success, failure ]

  - name: format
    image: codeberg.org/nbcli/dev-tools:latest
    commands:
      - black . --check
    when:
      status: [ success, failure ]

  - name: test
    image: codeberg.org/nbcli/dev-tools:latest
    commands:
      - coverage run -m pytest -v
    when:
      status: [ success, failure ]

  - name: coverage
    image: codeberg.org/nbcli/dev-tools:latest
    commands:
      - coverage report --fail-under=100
    when:
      status: [ success, failure ]

when:
  event: [ push, pull_request ]
